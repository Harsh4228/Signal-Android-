# Production stack for one Linux server (VPS):
#   caddy  - HTTPS (free Let's Encrypt certificate) in front of the CellMate server
#   server - CellMate relay (only public keys + ciphertext)
#   db     - PostgreSQL (accounts, public keys, queued ciphertext)
#   backup - nightly pg_dump of the database, kept 14 days
#   offsite - (optional) encrypted copy of the backups + attachments in Oracle Object Storage / any S3 bucket
#   coturn - TURN relay so calls work behind any NAT and hide users' IP addresses
#
# Setup:  cp .env.example .env   (fill it in)   then   docker compose up -d --build
# Update: git pull   then   docker compose up -d --build

# Every container keeps at most 3 x 10 MB of logs, so logs can never fill the disk.
x-logging: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    environment:
      TRUST_PROXY: "1"
      # Official address. Apps registered under an old domain (OLD_DOMAINS) move to this one by themselves.
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in infra/.env}
      DATABASE_URL: postgres://meetme:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@db:5432/meetme
      ATTACHMENTS_DIR: /data/attachments
      # Wake-up pushes: put the Firebase service account at infra/secrets/fcm-service-account.json
      FCM_SERVICE_ACCOUNT_FILE: /run/meetme-secrets/fcm-service-account.json
      ADMIN_USERS: ${ADMIN_USERS}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-0}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in infra/.env}
    volumes:
      - meetme-data:/data
      - ./secrets:/run/meetme-secrets:ro
    # Not published to the internet: only Caddy talks to it.
    expose:
      - '8080'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: meetme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meetme
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetme -d meetme"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Only reachable from the other containers, never from the internet.

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    logging: *logs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tables() { psql -h db -U meetme -d meetme -tAc "select count(*) from information_schema.tables where table_schema='public'"; }
        while true; do
          # A dump of a database without tables restores nothing: wait for the server to create them.
          if [ "$$(tables 2>/dev/null || echo 0)" -gt 0 ]; then
            f=/backups/meetme-$$(date +%F).dump
            if pg_dump -h db -U meetme -d meetme -Fc -f "$$f.tmp" && [ "$$(pg_restore -l "$$f.tmp" | grep -c ' TABLE DATA ')" -gt 0 ]; then
              mv "$$f.tmp" "$$f" && echo "backup ok: $$f ($$(du -h "$$f" | cut -f1))"
            else
              rm -f "$$f.tmp"; echo "backup FAILED or EMPTY: keeping the older backups, retrying in 1 hour"; sleep 3600; continue
            fi
            # Old dumps are only removed once today's dump worked.
            find /backups -name "meetme-*.dump" -mtime +14 -delete
            sleep 86400
          else
            echo "backup waiting: the database has no tables yet"; sleep 600
          fi
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logs
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infra/.env}
      OLD_DOMAINS: ${OLD_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Desktop app updates (installers + latest*.yml from the Desktop workflow), served at /updates/
      - ./updates:/srv/updates:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    logging: *logs
    # TURN needs a large UDP port range; host networking is simplest and fastest.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49400
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # Never relay into private networks (stops people using TURN to reach your internal machines).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      # Oracle / AWS / GCP give the VM a private IP behind 1:1 NAT: coturn must announce the public one.
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in infra/.env}/${PRIVATE_IP:?set PRIVATE_IP in infra/.env}

  # Off-site copy, so a lost VM doesn't take the backups with it. Enable with COMPOSE_PROFILES=offsite in .env.
  # Everything is encrypted with BACKUP_PASSPHRASE (rclone crypt) before upload: the bucket only sees ciphertext.
  # Restore the dumps:  docker compose run --rm offsite 'setup && rclone copy secure:db /backups/restore'
  offsite:
    image: rclone/rclone:1.71
    profiles: [offsite]
    restart: unless-stopped
    logging: *logs
    environment:
      RCLONE_CONFIG_BUCKET_TYPE: s3
      RCLONE_CONFIG_BUCKET_PROVIDER: Other
      RCLONE_CONFIG_BUCKET_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_BUCKET_REGION: ${S3_REGION:-}
      RCLONE_CONFIG_BUCKET_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_BUCKET_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_BUCKET_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_BUCKET_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_SECURE_TYPE: crypt
      RCLONE_CONFIG_SECURE_REMOTE: bucket:${S3_BUCKET:-meetme-backups}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - meetme-data:/data:ro
    entrypoint: ["/bin/sh", "-c", "setup() { [ -n \"$$BACKUP_PASSPHRASE\" ] || { echo 'set BACKUP_PASSPHRASE in infra/.env'; exit 1; }; export RCLONE_CONFIG_SECURE_PASSWORD=\"$$(rclone obscure \"$$BACKUP_PASSPHRASE\")\"; }; eval \"$$0\""]
    command:
      - |
        setup
        # Give the backup service time to write today's dump first.
        sleep 600
        while true; do
          rclone copy /backups secure:db --include "meetme-*.dump" \
            && rclone delete secure:db --min-age 30d \
            && rclone sync /data/attachments secure:attachments \
            && echo "offsite ok"
          sleep 86400
        done

volumes:
  meetme-data:
  pg-data:
  caddy-data:
  caddy-config:
