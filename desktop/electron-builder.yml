appId: app.meetme.desktop
productName: MeetMe
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.social-networking
  hardenedRuntime: true
  extendInfo:
    NSCameraUsageDescription: MeetMe needs the camera for video calls.
    NSMicrophoneUsageDescription: MeetMe needs the microphone for calls.
linux:
  target: AppImage
  category: Network
