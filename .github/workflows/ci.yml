# Runs on every push and pull request: typecheck + all tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A test that hangs fails the run instead of using up runner minutes.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meetme
          POSTGRES_PASSWORD: meetme
          POSTGRES_DB: meetme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meetme" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (SQLite)
        run: npm test
      - name: Tests (PostgreSQL, incl. two server instances)
        run: npm test -w @meetme/server
        env:
          TEST_DATABASE_URL: postgres://meetme:meetme@localhost:5432/meetme_test

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
